
<script>
        // ============================================================
        // 🎨 COLORES (24)
        // ============================================================
        const COLORES = [
            "#e07a52", "#4fa3ab", "#eac35c", "#a86d9e", "#6cb4a0", "#d48b6a", "#8ab8c9", "#c9a87c",
            "#f4a460", "#7b68ee", "#20b2aa", "#ff6b6b", "#48d1cc", "#ffa07a", "#9370db", "#3cb371",
            "#ff69b4", "#00bfff", "#ff8c00", "#adff2f", "#ff1493", "#00fa9a", "#ff4500", "#7cfc00"
        ];
        let colorSeleccionado = COLORES[0];

        // ============================================================
        // 🗺️ LUGARES DE TAIFAS
        // ============================================================
        const LUGARES_TAIFAS = ["La Sabinita", "Támbara", "Arraigo", "El Patio", "Princesa Iraya"];

        // ============================================================
        // 📦 BAILES (EJEMPLO - REEMPLAZA CON TUS 175 BAILES)
        // ============================================================
        const BAILES = [
            { id: 1, nombre: "FOLÍAS DE ARICO (A.F. LAS HIEDRAS)", enlace: "https://telegram.me/c/2585777945/18", estrellas: 4 },
            { id: 2, nombre: "FOLÍAS DE ARICO", enlace: "https://telegram.me/c/2585777945/22", estrellas: 4 },
            // AQUÍ PON EL RESTO DE TUS BAILES (175)
        ];

        // ============================================================
        // 📝 PREGUNTAS (EJEMPLO - REEMPLAZA CON TUS 150 PREGUNTAS)
        // ============================================================
        const PREGUNTAS = [
            { id: 501, pregunta: "¿A partir de qué fecha comienza el análisis de la Indumentaria tradicional en Canarias?", opciones: ["S. V antes de Cristo", "Con Cristóbal Colón", "A partir del siglo XVIII"], correcta: 2, explicacion: "El análisis de la indumentaria tradicional en Canarias comienza a partir del siglo XVIII." },
            { id: 502, pregunta: "¿En qué se basa el estudio de la Indumentaria Tradicional?", opciones: ["Datos/archivos/grabados", "Prendas testigo", "Testamentos", "Todas son correctas"], correcta: 3, explicacion: "El estudio de la indumentaria tradicional se basa en datos/archivos/grabados, prendas testigo y testamentos." },
            // AQUÍ PON EL RESTO DE TUS PREGUNTAS (150)
        ];

        // ============================================================
        // 👗 VESTIMENTAS (EJEMPLO - REEMPLAZA CON TUS 149 VESTIMENTAS)
        // ============================================================
        const VESTIMENTAS = [
            { id: 501, titulo: "Mujer del siglo XVIII en traje de diario", enlace: "https://t.me/c/2585777945/1078", isla: "Tenerife" },
            { id: 502, titulo: "Mujer del siglo XVIII en traje de diario", enlace: "https://t.me/c/2585777945/1082", isla: "Tenerife" },
            // AQUÍ PON EL RESTO DE TUS VESTIMENTAS (149)
        ];
        // FILTRO DE HÁBITOS (IDs 632-644) - AJUSTA SEGÚN TUS DATOS
        const VESTIMENTAS_FILTRADAS = VESTIMENTAS.filter(v => v.id < 632 || v.id > 644);

        // ============================================================
        // 🎶 COPLAS (EJEMPLO - REEMPLAZA CON TUS 133 COPLAS)
        // ============================================================
        const COPLAS = [
            { id: 300, texto: "Lechera de los .........1 a ti ninguna se iguala ¡ay quien fuera un aroplano pa dirte .............2 el ala!", palabras: ["Rodeos", "arrastrar"], autor: "Nijota", enlace: "https://t.me/c/2585777945/670" },
            { id: 301, texto: "Isla del Hierro ........ 1, tierra que no olvidaré, para ti son mis ........ 2 recordando al Garoe", palabras: ["bravía", "folías"], autor: "Los Huracheros", enlace: "https://t.me/c/2585777945/673" },
            // AQUÍ PON EL RESTO DE TUS COPLAS (133)
        ];

        // ============================================================
        // ISLAS CANARIAS (8)
        // ============================================================
        const ISLAS_CANARIAS = ["Tenerife", "Gran Canaria", "La Palma", "Lanzarote", "Fuerteventura", "El Hierro", "La Gomera", "La Graciosa"];

        // ============================================================
        // 🎮 ESTADO GLOBAL
        // ============================================================
        let jugadores = [];
        let partidaActiva = false;
        let turnoActual = 0;
        let asistenteActual = 1;
        let ronda = 0;
        let esperandoEleccion = false;
        let opcionesGeneradas = [];
        let mazos = { bailes: [], preguntas: [], vestimentas: [], coplas: [] };
        let historial = [];
        let pruebaEnCurso = null;
        let votacionEnCurso = null;
        let participantesTaifas = [];

        // ============================================================
        // ⏱️ TEMPORIZADOR PARA PRUEBAS
        // ============================================================
        let tiempoSeleccionadoPrueba = 15;
        let tiempoRestantePrueba = 15;
        let temporizadorActivoPrueba = false;
        let intervaloPrueba = null;

        // ============================================================
        // 🎯 VARIABLES DE COPLA (CORREGIDAS - SIN window.)
        // ============================================================
        let coplaSeleccionadas = [];
        let coplaPalabrasCorrectas = [];

        // ============================================================
        // 🛠️ FUNCIONES AUXILIARES
        // ============================================================
        function mostrarToast(mensaje, duracion) {
            duracion = duracion || 2800;
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = mensaje;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), duracion);
        }

        function mezclarArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function getJugadorActivo() { return jugadores[turnoActual] || null; }
        function getAsistente() {
            if (jugadores.length < 2) return null;
            return jugadores[asistenteActual] || null;
        }

        // ============================================================
        // 🃏 INICIALIZAR MAZOS (YA NO FILTRA LAS PREGUNTAS DE HÁBITO)
        // ============================================================
        function inicializarMazos() {
            mazos.bailes = BAILES.map(b => ({ ...b }));
            mezclarArray(mazos.bailes);
            // ✅ AHORA ENTRAN TODAS LAS PREGUNTAS (incluidas las de hábito)
            mazos.preguntas = PREGUNTAS.map(p => ({ ...p }));
            mezclarArray(mazos.preguntas);
            mazos.vestimentas = VESTIMENTAS_FILTRADAS.map(v => ({ ...v }));
            mezclarArray(mazos.vestimentas);
            mazos.coplas = COPLAS.map(c => ({ ...c }));
            mezclarArray(mazos.coplas);
        }

        function recargarMazo(mazoKey) {
            let todas = [];
            if (mazoKey === 'bailes') todas = BAILES.map(b => ({ ...b }));
            else if (mazoKey === 'preguntas') todas = PREGUNTAS.map(p => ({ ...p })); // ✅ YA NO FILTRA
            else if (mazoKey === 'vestimentas') todas = VESTIMENTAS_FILTRADAS.map(v => ({ ...v }));
            else if (mazoKey === 'coplas') todas = COPLAS.map(c => ({ ...c }));
            const enUso = [];
            jugadores.forEach(j => {
                const seccion = mazoKey === 'bailes' ? 'bailes' : mazoKey === 'preguntas' ? 'preguntas' : mazoKey === 'vestimentas' ? 'vestimentas' : 'coplas';
                enUso.push(...j.casillero[seccion].map(c => c.id));
            });
            const disponibles = todas.filter(c => !enUso.includes(c.id));
            mazos[mazoKey] = mezclarArray(disponibles);
        }

        // ============================================================
        // GENERAR OPCIONES PARA LAS PRUEBAS
        // ============================================================
        function generarOpcionesBaile(carta, total) {
            const opciones = [carta];
            const otras = BAILES.filter(b => b.id !== carta.id);
            const mezcladas = mezclarArray([...otras]);
            for (let i = 0; i < Math.min(total - 1, mezcladas.length); i++) {
                opciones.push(mezcladas[i]);
            }
            return mezclarArray(opciones);
        }

        function generarOpcionesIslas(correcta) {
            return mezclarArray([...ISLAS_CANARIAS]);
        }

        function generarOpcionesCopla(carta) {
            const correctas = carta.palabras.map(p => p.trim().toLowerCase());
            const todas = [];
            COPLAS.forEach(c => {
                c.palabras.forEach(p => {
                    const pNorm = p.trim().toLowerCase();
                    if (!todas.includes(pNorm) && !correctas.includes(pNorm)) {
                        todas.push(pNorm);
                    }
                });
            });
            const mezcladas = mezclarArray([...todas]);
            const opciones = [...correctas];
            for (let i = 0; i < 8 && i < mezcladas.length; i++) {
                if (!opciones.includes(mezcladas[i])) {
                    opciones.push(mezcladas[i]);
                }
            }
            const genericas = ["amor", "mar", "tierra", "cielo", "vida", "sol", "luna", "flor", "canto", "viento"];
            while (opciones.length < 10) {
                const gen = genericas[Math.floor(Math.random() * genericas.length)];
                if (!opciones.includes(gen) && !correctas.includes(gen)) {
                    opciones.push(gen);
                }
            }
            return mezclarArray(opciones);
        }

        // ============================================================
        // 🎨 SELECTOR DE COLOR
        // ============================================================
        function renderizarSelectorColor() {
            const container = document.getElementById('selectorColor');
            container.innerHTML = '';
            COLORES.forEach(color => {
                const btn = document.createElement('button');
                btn.className = 'btn-color';
                btn.style.background = color;
                btn.dataset.color = color;
                if (color === colorSeleccionado) btn.classList.add('seleccionado');
                btn.onclick = () => {
                    colorSeleccionado = color;
                    document.querySelectorAll('.btn-color').forEach(b => b.classList.remove('seleccionado'));
                    btn.classList.add('seleccionado');
                };
                container.appendChild(btn);
            });
        }

        // ============================================================
        // 👥 FUNCIONES DE JUGADORES
        // ============================================================
        function añadirJugador() {
            const input = document.getElementById("nombreJugador");
            const nombre = input.value.trim();
            if (!nombre) { mostrarToast("Escribe un nombre."); return; }
            if (jugadores.some(j => j.nombre === nombre)) { mostrarToast("Ya existe."); return; }
            if (jugadores.some(j => j.color === colorSeleccionado)) { mostrarToast("Color en uso."); return; }
            jugadores.push({
                nombre,
                color: colorSeleccionado,
                casillero: { bailes: [], preguntas: [], vestimentas: [], coplas: [], comodines: [], taifasLogrados: [] }
            });
            input.value = "";
            actualizarListaJugadores();
            renderizarCasilleros();
            guardarPartidaAuto();
            mostrarToast(`✅ ${nombre} añadido.`);
        }

        function eliminarJugadores() {
            if (!confirm("¿Vaciar lista?")) return;
            jugadores = [];
            partidaActiva = false;
            turnoActual = 0;
            ronda = 0;
            actualizarListaJugadores();
            renderizarCasilleros();
            document.getElementById("btnTerminarPartida").style.display = "none";
            document.getElementById("btnIniciarPartida").textContent = "🎵 Iniciar BAILANDO VENGO";
            document.getElementById("zonaDado").style.display = "none";
            localStorage.removeItem('granJuegoFinal');
            mostrarToast("🗑️ Lista vaciada.");
        }

        function barajarOrden() {
            if (jugadores.length < 2) { mostrarToast("Mínimo 2."); return; }
            if (partidaActiva) { mostrarToast("⚠️ No durante la partida."); return; }
            mezclarArray(jugadores);
            actualizarListaJugadores();
            renderizarCasilleros();
            guardarPartidaAuto();
            mostrarToast("🔀 Orden barajado.");
        }

        function actualizarListaJugadores() {
            const container = document.getElementById("listaJugadores");
            if (jugadores.length === 0) { container.innerHTML = "<span style='color:var(--sand-dim);'>No hay jugadores.</span>"; return; }
            let html = "";
            jugadores.forEach((j, index) => {
                const esTurno = partidaActiva && index === turnoActual;
                const esAsistente = partidaActiva && index === asistenteActual;
                let etiqueta = "";
                if (esTurno) etiqueta = " 🎯";
                else if (esAsistente) etiqueta = " 🎭";
                html += `<div class="jugador-item" style="border-color:${j.color};">${index+1}. ${j.nombre}${etiqueta}</div>`;
            });
            container.innerHTML = html;
        }

        // ============================================================
        // 🚀 INICIAR PARTIDA (con rotación de asistente)
        // ============================================================
        function iniciarPartida() {
            if (jugadores.length < 2) { mostrarToast("❌ Mínimo 2 jugadores."); return; }
            if (partidaActiva) { mostrarToast("⚠️ Ya en curso."); return; }
            jugadores.forEach(j => {
                j.casillero = { bailes: [], preguntas: [], vestimentas: [], coplas: [], comodines: [], taifasLogrados: [] };
            });
            inicializarMazos();
            partidaActiva = true;
            turnoActual = 0;
            ronda = 0;
            // ✅ ASISTENTE ROTATIVO (justo)
            asistenteActual = (turnoActual + 1) % jugadores.length;
            if (asistenteActual === turnoActual) asistenteActual = (asistenteActual + 1) % jugadores.length;
            historial = [];
            document.getElementById("btnIniciarPartida").textContent = "🎵 Partida en curso";
            document.getElementById("btnTerminarPartida").style.display = "inline-block";
            renderizarCasilleros();
            actualizarListaJugadores();
            guardarPartidaAuto();
            const jugador = getJugadorActivo();
            const asistente = getAsistente();
            mostrarToast(`🎵 ¡Comienza! Ronda ${ronda+1} · 🎯 Turno de ${jugador.nombre} (Asistente: ${asistente ? asistente.nombre : 'Sin asistente'})`);
            setTimeout(() => {
                if (partidaActiva && !pruebaEnCurso && !esperandoEleccion) {
                    tirarDado();
                }
            }, 800);
        }

        // ============================================================
        // 🔄 SIGUIENTE TURNO (con rotación de asistente)
        // ============================================================
        function siguienteTurno() {
            if (!partidaActiva) { mostrarToast("⚠️ No hay partida."); return; }
            if (esperandoEleccion) { mostrarToast("⚠️ Primero elige una prueba."); return; }
            if (pruebaEnCurso) { mostrarToast("⚠️ Termina la prueba actual."); return; }
            if (votacionEnCurso) { mostrarToast("⚠️ Termina la votación."); return; }

            document.getElementById("zonaDado").style.display = "none";
            turnoActual = (turnoActual + 1) % jugadores.length;
            if (turnoActual === 0) ronda++;
            
            // ✅ ASISTENTE ROTATIVO (justo)
            asistenteActual = (turnoActual + 1) % jugadores.length;
            if (asistenteActual === turnoActual) {
                asistenteActual = (asistenteActual + 1) % jugadores.length;
            }

            renderizarCasilleros();
            actualizarListaJugadores();
            guardarPartidaAuto();
            const jugador = getJugadorActivo();
            const asistente = getAsistente();
            mostrarToast(`🔄 Ronda ${ronda+1} · 🎯 Turno de ${jugador.nombre} (Asistente: ${asistente ? asistente.nombre : 'Sin asistente'})`);
            setTimeout(() => {
                if (partidaActiva && !pruebaEnCurso && !esperandoEleccion) {
                    tirarDado();
                }
            }, 800);
        }

        // ============================================================
        // 🎲 DADO + OPCIONES (NUEVA DISTRIBUCIÓN)
        // ============================================================
        const NOMBRES_PRUEBAS = {
            ver: '👀 Ver vídeo',
            escuchar: '👂 Escuchar',
            mimica: '💆 Mímica',
            pregunta: '❓ Pregunta',
            vestimenta: '👗 Vestimenta',
            copla: '🎶 Copla'
        };
        const TIPOS_PRUEBA = ['ver', 'escuchar', 'mimica', 'pregunta', 'vestimenta', 'copla'];

        function tirarDado() {
            if (!partidaActiva) { mostrarToast("⚠️ No hay partida."); return; }
            const jugador = getJugadorActivo();
            if (!jugador) return;
            if (esperandoEleccion) { mostrarToast("⚠️ Ya tienes opciones, elige."); return; }
            if (pruebaEnCurso) { mostrarToast("⚠️ Termina la prueba actual."); return; }
            if (votacionEnCurso) { mostrarToast("⚠️ Termina la votación."); return; }

            const tirada = Math.floor(Math.random() * 6) + 1;
            let numOpciones = 1;
            let mensajeExtra = '';

            // ✅ NUEVA DISTRIBUCIÓN
            switch(tirada) {
                case 1: numOpciones = 1; mensajeExtra = '🎲 1 opción'; break;
                case 2: numOpciones = 2; mensajeExtra = '🎲 2 opciones'; break;
                case 3: numOpciones = 2; mensajeExtra = '🎲 2 opciones'; break;
                case 4: numOpciones = 3; mensajeExtra = '🎲 3 opciones'; break;
                case 5: numOpciones = 3; mensajeExtra = '🎲 3 opciones'; break;
                case 6: numOpciones = 6; mensajeExtra = '🎲 ¡Todas las pruebas!'; break;
            }

            let opciones = [];
            if (numOpciones === 6) {
                opciones = [...TIPOS_PRUEBA];
            } else {
                for (let i = 0; i < numOpciones; i++) {
                    let elegida = TIPOS_PRUEBA[Math.floor(Math.random() * TIPOS_PRUEBA.length)];
                    // Evitar duplicados si numOpciones > 1
                    while (opciones.includes(elegida)) {
                        elegida = TIPOS_PRUEBA[Math.floor(Math.random() * TIPOS_PRUEBA.length)];
                    }
                    opciones.push(elegida);
                }
            }

            opcionesGeneradas = opciones;
            esperandoEleccion = true;

            const zona = document.getElementById('zonaDado');
            zona.style.display = 'block';
            let html = `<div class="opciones-dado">
                <div class="titulo">🎲 Tirada: ${tirada} → ${mensajeExtra}</div>
                <div style="margin:8px 0; font-size:0.95em; color:var(--sand-dim);">
                    ${jugador.nombre}, elige una prueba. Asistente: ${getAsistente() ? getAsistente().nombre : 'Sin asistente'}
                </div>
                <div style="display:flex; flex-wrap:wrap; justify-content:center; gap:6px;">`;
            opciones.forEach((op, index) => {
                const nombre = NOMBRES_PRUEBAS[op] || op;
                html += `<button class="opcion-btn" onclick="elegirPrueba('${op}')">${nombre}</button>`;
            });
            html += `</div>
                <button class="btn-texto" onclick="cancelarTirada()" style="margin-top:8px;">Cancelar</button>
            </div>`;
            zona.innerHTML = html;
            guardarPartidaAuto();
        }

        function elegirPrueba(opcion) {
            if (!esperandoEleccion) return;
            esperandoEleccion = false;
            const jugador = getJugadorActivo();
            const asistente = getAsistente();
            const nombre = NOMBRES_PRUEBAS[opcion] || opcion;
            mostrarToast(`✅ ${jugador.nombre} elige: ${nombre} (Asistente: ${asistente ? asistente.nombre : 'Sin asistente'})`);
            document.getElementById('zonaDado').style.display = 'none';
            abrirPrueba(opcion);
            guardarPartidaAuto();
        }

        function cancelarTirada() {
            if (!esperandoEleccion) return;
            esperandoEleccion = false;
            document.getElementById('zonaDado').style.display = 'none';
            mostrarToast("🔄 Tirada cancelada.");
            setTimeout(() => {
                if (partidaActiva && !pruebaEnCurso && !esperandoEleccion) {
                    tirarDado();
                }
            }, 500);
            guardarPartidaAuto();
        }

        // ============================================================
        // ⏱️ TEMPORIZADOR: FUNCIONES
        // ============================================================
        function seleccionarTiempoPrueba(segundos) {
            tiempoSeleccionadoPrueba = segundos;
            tiempoRestantePrueba = segundos;
            actualizarDisplayTiempoPrueba();
            document.querySelectorAll('#modalPrueba .btn-tiempo').forEach(b => b.classList.remove('activo'));
            document.querySelector(`#modalPrueba .btn-tiempo[data-tiempo="${segundos}"]`).classList.add('activo');
            detenerTemporizadorPrueba();
        }

        function iniciarTemporizadorPrueba() {
            if (temporizadorActivoPrueba) { detenerTemporizadorPrueba(); return; }
            tiempoRestantePrueba = tiempoSeleccionadoPrueba;
            temporizadorActivoPrueba = true;
            actualizarDisplayTiempoPrueba();
            intervaloPrueba = setInterval(() => {
                tiempoRestantePrueba--;
                actualizarDisplayTiempoPrueba();
                if (tiempoRestantePrueba <= 0) {
                    detenerTemporizadorPrueba();
                    mostrarToast("⏰ ¡Tiempo!");
                    if (pruebaEnCurso && !pruebaEnCurso.respondida) {
                        pruebaEnCurso.respondida = true;
                        document.querySelectorAll('#contenidoPrueba .btn-opcion').forEach(b => b.disabled = true);
                        document.querySelectorAll('#contenidoPrueba .btn-opcion').forEach(b => {
                            if (b.dataset.correcta === 'true') b.classList.add('correcta');
                        });
                        mostrarToast(`⏰ ${pruebaEnCurso.jugador.nombre} se quedó sin tiempo`);
                        setTimeout(() => {
                            document.getElementById('modalPrueba').classList.remove('visible');
                            finalizarPrueba(false, pruebaEnCurso);
                        }, 800);
                    }
                }
            }, 1000);
        }

        function detenerTemporizadorPrueba() {
            temporizadorActivoPrueba = false;
            if (intervaloPrueba) {
                clearInterval(intervaloPrueba);
                intervaloPrueba = null;
            }
            actualizarDisplayTiempoPrueba();
        }

        function actualizarDisplayTiempoPrueba() {
            const display = document.getElementById('displayTiempoPrueba');
            if (!display) return;
            display.textContent = tiempoRestantePrueba;
            display.className = (tiempoRestantePrueba <= 5 && tiempoRestantePrueba > 0) ? 'display urgente' : 'display';
        }

        // ============================================================
        // 🎯 ABRIR PRUEBA (con soporte para hábitos e imágenes)
        // ============================================================
        function abrirPrueba(tipo) {
            const jugador = getJugadorActivo();
            const asistente = getAsistente();
            if (!jugador) return;

            let mazoKey = '', seccion = '', carta = null, titulo = '';
            switch (tipo) {
                case 'ver': case 'escuchar': case 'mimica':
                    mazoKey = 'bailes'; seccion = 'bailes'; titulo = '🎵 Adivina el baile';
                    break;
                case 'pregunta':
                    mazoKey = 'preguntas'; seccion = 'preguntas'; titulo = '❓ Responde la pregunta';
                    break;
                case 'vestimenta':
                    mazoKey = 'vestimentas'; seccion = 'vestimentas'; titulo = '👗 ¿De qué isla es?';
                    break;
                case 'copla':
                    mazoKey = 'coplas'; seccion = 'coplas'; titulo = '🎶 Completa la copla';
                    break;
            }

            if (mazos[mazoKey] && mazos[mazoKey].length > 0) {
                carta = mazos[mazoKey].pop();
            } else {
                recargarMazo(mazoKey);
                if (mazos[mazoKey].length === 0) {
                    mostrarToast("⚠️ No hay cartas disponibles.");
                    return;
                }
                carta = mazos[mazoKey].pop();
            }

            pruebaEnCurso = { tipo, carta, mazoKey, seccion, jugador, asistente, respondida: false };
            detenerTemporizadorPrueba();
            tiempoRestantePrueba = tiempoSeleccionadoPrueba;
            actualizarDisplayTiempoPrueba();

            const modal = document.getElementById('modalPrueba');
            modal.classList.add('visible');
            document.getElementById('tituloPrueba').textContent = titulo;

            const container = document.getElementById('contenidoPrueba');
            let html = `<div class="prueba-container">`;

            // === VER / ESCUCHAR / MÍMICA ===
            if (tipo === 'ver' || tipo === 'escuchar' || tipo === 'mimica') {
                const mensaje = tipo === 'ver' ? '👀 Mira el vídeo 🔇 SIN SONIDO' :
                               tipo === 'escuchar' ? '👂 Escucha el audio (no mires)' :
                               '💆 El jugador ve el vídeo y hace mímica. El asistente adivina.';
                const textoAyuda = tipo === 'mimica' ? 'El asistente, ¿qué baile es?' : '¿Cuál es el baile?';
                
                let textoEnlace = '';
                if (tipo === 'mimica') textoEnlace = 'Ver vídeo (solo el jugador)';
                else if (tipo === 'escuchar') textoEnlace = 'Abrir audio 🔊 (no mires)';
                else textoEnlace = 'Abrir vídeo 🔇 sin sonido';

                html += `<p style="color:var(--sand-dim); margin:8px 0;">${mensaje}</p>
                    <a href="${carta.enlace}" target="_blank" class="enlace-prueba">🎬 ${textoEnlace}</a>
                    <p style="color:var(--sand-dim); font-size:0.9em;">${textoAyuda}</p>
                    <div class="opciones-grid">`;
                const opciones = generarOpcionesBaile(carta, 4);
                opciones.forEach(op => {
                    const esCorrecta = op.id === carta.id;
                    html += `<button class="btn-opcion" data-correcta="${esCorrecta}" data-id="${op.id}" onclick="responderPruebaOpcion(this, ${esCorrecta})">${op.nombre}</button>`;
                });
                html += `</div>`;
            }
            // === PREGUNTA (con soporte para imágenes de hábito) ===
            else if (tipo === 'pregunta') {
                let htmlPregunta = `<p style="color:var(--sand); font-weight:600; margin-bottom:8px;">${carta.pregunta}</p>`;
                // ✅ Si es hábito, mostrar el enlace a la imagen
                if (carta.imagen && carta.enlace) {
                    htmlPregunta += `<a href="${carta.enlace}" target="_blank" class="enlace-prueba" style="margin:10px 0;">🖼️ Ver imagen del hábito</a>`;
                }
                htmlPregunta += `<div class="opciones-grid" style="flex-direction:column;">`;
                carta.opciones.forEach((op, index) => {
                    const esCorrecta = index === carta.correcta;
                    const letra = String.fromCharCode(65 + index);
                    htmlPregunta += `<button class="btn-opcion" data-correcta="${esCorrecta}" onclick="responderPruebaOpcion(this, ${esCorrecta})">${letra}) ${op}</button>`;
                });
                htmlPregunta += `</div>`;
                html += htmlPregunta;
            }
            // === VESTIMENTA ===
            else if (tipo === 'vestimenta') {
                html += `<a href="${carta.enlace}" target="_blank" class="enlace-prueba">👗 Ver vestimenta</a>
                    <p style="color:var(--sand-dim); font-size:0.9em;">¿De qué isla es?</p>
                    <div class="opciones-grid">`;
                const opciones = generarOpcionesIslas(carta.isla);
                opciones.forEach(isla => {
                    const esCorrecta = isla === carta.isla;
                    html += `<button class="btn-opcion" data-correcta="${esCorrecta}" onclick="responderPruebaOpcion(this, ${esCorrecta})">${isla}</button>`;
                });
                html += `</div>`;
            }
            // === COPLA ===
            else if (tipo === 'copla') {
                const textoConHuecos = carta.texto.replace(/\.{5,}/g, '_____');
                html += `<p style="color:var(--sand); font-weight:600; margin-bottom:4px;">${textoConHuecos}</p>
                    <p style="color:var(--sand-dim); font-size:0.9em; margin-bottom:4px;">🎯 Completa las palabras que faltan (${carta.palabras.length} palabras)</p>
                    <p style="color:var(--sand-dim); font-size:0.9em; margin-bottom:8px;">📖 El asistente puede ver la copla completa en el enlace de abajo</p>
                    <a href="${carta.enlace}" target="_blank" class="enlace-prueba">🔗 Ver copla completa (solo asistente)</a>
                    <p style="color:var(--sand-dim); font-size:0.9em; margin:6px 0;">Elige las palabras correctas (${carta.palabras.length} palabras):</p>
                    <div class="opciones-grid">`;
                const opciones = generarOpcionesCopla(carta);
                opciones.forEach(palabra => {
                    const esCorrecta = carta.palabras.map(p => p.trim().toLowerCase()).includes(palabra);
                    html += `<button class="btn-opcion" data-correcta="${esCorrecta}" data-palabra="${palabra}" onclick="responderPruebaCopla(this, '${palabra}')">${palabra}</button>`;
                });
                html += `</div>
                    <p style="color:var(--sand-dim); font-size:0.85em; margin-top:6px;">👆 Pulsa las ${carta.palabras.length} palabras correctas</p>
                    <div style="margin-top:8px; display:flex; justify-content:center; gap:8px; flex-wrap:wrap;">
                        <span style="color:var(--sand-dim); font-size:0.9em;">Seleccionadas: <span id="coplaSeleccionadas" class="copla-contador">0</span>/${carta.palabras.length}</span>
                        <button class="btn-texto" onclick="limpiarSeleccionCopla()">Limpiar</button>
                    </div>`;
            }
            html += `</div>`;
            container.innerHTML = html;

            if (tipo === 'copla') {
                coplaSeleccionadas = [];
                coplaPalabrasCorrectas = carta.palabras.map(p => p.trim().toLowerCase());
                document.getElementById('coplaSeleccionadas').textContent = '0';
            }
        }

        // ============================================================
        // 🎯 RESPONDER PRUEBA COPLA
        // ============================================================
        function responderPruebaCopla(btn, palabra) {
            if (!pruebaEnCurso || pruebaEnCurso.respondida) return;
            const idx = coplaSeleccionadas.indexOf(palabra);
            if (idx !== -1) {
                coplaSeleccionadas.splice(idx, 1);
                btn.classList.remove('seleccionada');
                btn.style.borderColor = 'var(--line)';
                btn.style.background = 'var(--basalt-2)';
            } else {
                if (coplaSeleccionadas.length >= coplaPalabrasCorrectas.length) {
                    mostrarToast(`⚠️ Ya has seleccionado ${coplaPalabrasCorrectas.length} palabras.`);
                    return;
                }
                coplaSeleccionadas.push(palabra);
                btn.classList.add('seleccionada');
                btn.style.borderColor = 'var(--ochre)';
                btn.style.background = 'rgba(212,160,23,0.2)';
            }
            document.getElementById('coplaSeleccionadas').textContent = coplaSeleccionadas.length;
            if (coplaSeleccionadas.length === coplaPalabrasCorrectas.length) {
                const seleccionadasOrdenadas = [...coplaSeleccionadas].sort();
                const correctasOrdenadas = [...coplaPalabrasCorrectas].sort();
                const esCorrecto = JSON.stringify(seleccionadasOrdenadas) === JSON.stringify(correctasOrdenadas);
                document.querySelectorAll('#contenidoPrueba .btn-opcion').forEach(b => {
                    b.disabled = true;
                    if (b.dataset.correcta === 'true') {
                        b.classList.add('correcta');
                    } else if (coplaSeleccionadas.includes(b.dataset.palabra)) {
                        b.classList.add('incorrecta');
                    }
                });
                pruebaEnCurso.respondida = true;
                setTimeout(() => {
                    document.getElementById('modalPrueba').classList.remove('visible');
                    finalizarPrueba(esCorrecto, pruebaEnCurso);
                }, 800);
            }
        }

        function limpiarSeleccionCopla() {
            if (pruebaEnCurso && pruebaEnCurso.respondida) return;
            coplaSeleccionadas = [];
            document.getElementById('coplaSeleccionadas').textContent = '0';
            document.querySelectorAll('#contenidoPrueba .btn-opcion').forEach(b => {
                b.classList.remove('seleccionada');
                b.style.borderColor = 'var(--line)';
                b.style.background = 'var(--basalt-2)';
            });
        }

        // ============================================================
        // 🎯 RESPONDER PRUEBA OPCIÓN
        // ============================================================
        function responderPruebaOpcion(btn, esCorrecto) {
            if (!pruebaEnCurso || pruebaEnCurso.respondida) return;
            pruebaEnCurso.respondida = true;
            document.querySelectorAll('#contenidoPrueba .btn-opcion').forEach(b => b.disabled = true);
            if (esCorrecto) {
                btn.classList.add('correcta');
            } else {
                btn.classList.add('incorrecta');
                document.querySelectorAll('#contenidoPrueba .btn-opcion').forEach(b => {
                    if (b.dataset.correcta === 'true') b.classList.add('correcta');
                });
            }
            setTimeout(() => {
                document.getElementById('modalPrueba').classList.remove('visible');
                finalizarPrueba(esCorrecto, pruebaEnCurso);
            }, 800);
        }

        // ============================================================
        // 🎯 FINALIZAR PRUEBA
        // ============================================================
        function finalizarPrueba(esCorrecto, prueba) {
            detenerTemporizadorPrueba();
            const { tipo, carta, mazoKey, seccion, jugador, asistente } = prueba;
            if (esCorrecto) {
                const casillero = jugador.casillero;
                const maximo = seccion === 'bailes' ? 5 : 3;
                if (casillero[seccion].length < maximo) {
                    casillero[seccion].push(carta);
                    mostrarToast(`✅ ${jugador.nombre} ha ganado: ${carta.nombre || carta.titulo || `ID ${carta.id}`}`);
                } else {
                    const descartada = casillero[seccion].shift();
                    casillero[seccion].push(carta);
                    mostrarToast(`🔄 Sección llena. Descartado: ${descartada.nombre || descartada.titulo || `ID ${descartada.id}`}`);
                }
                if (asistente && asistente.casillero.comodines.length < 5) {
                    asistente.casillero.comodines.push({});
                    mostrarToast(`⭐ ${asistente.nombre} gana un comodín.`, 2000);
                }
            } else {
                mostrarToast(`❌ ${jugador.nombre} ha fallado.`);
                mazos[mazoKey].push(carta);
            }
            historial.push({
                ronda: ronda + 1,
                jugador: jugador.nombre,
                tipo: tipo,
                exito: esCorrecto,
                carta: carta ? carta.id : null
            });
            pruebaEnCurso = null;
            renderizarCasilleros();
            guardarPartidaAuto();
            if (comprobarRequisitosTaifas(jugador)) {
                mostrarToast(`🏆 ¡${jugador.nombre} puede realizar un Baile de Taifas!`);
                renderizarCasilleros();
            }
            setTimeout(() => {
                if (partidaActiva) {
                    siguienteTurno();
                }
            }, 4000);
        }

        function cancelarPrueba() {
            if (!pruebaEnCurso) return;
            const { carta, mazoKey } = pruebaEnCurso;
            mazos[mazoKey].push(carta);
            pruebaEnCurso = null;
            coplaSeleccionadas = [];
            detenerTemporizadorPrueba();
            document.getElementById('modalPrueba').classList.remove('visible');
            mostrarToast("🔄 Prueba cancelada.");
            renderizarCasilleros();
            guardarPartidaAuto();
            setTimeout(() => {
                if (partidaActiva && !pruebaEnCurso && !esperandoEleccion) {
                    tirarDado();
                }
            }, 500);
        }

        // ============================================================
        // 🏆 REQUISITOS PARA BAILE DE TAIFAS
        // ============================================================
        function comprobarRequisitosTaifas(jugador) {
            const c = jugador.casillero;
            if (c.bailes.length < 5) return false;
            if (c.preguntas.length < 1) return false;
            if (c.vestimentas.length < 1) return false;
            if (c.coplas.length < 1) return false;
            if (c.comodines.length < 1) return false;
            const lugaresPendientes = LUGARES_TAIFAS.filter(l => !c.taifasLogrados.includes(l));
            return lugaresPendientes.length > 0;
        }

        // ============================================================
        // ⭐ COMODINES (canje)
        // ============================================================
        let comodinState = { comodines: 0, preguntas: 0, vestimentas: 0, coplas: 0 };

        function abrirModalComodin() {
            const jugador = getJugadorActivo();
            if (!jugador) return;
            comodinState = {
                comodines: jugador.casillero.comodines.length,
                preguntas: jugador.casillero.preguntas.length,
                vestimentas: jugador.casillero.vestimentas.length,
                coplas: jugador.casillero.coplas.length
            };
            const modal = document.getElementById("modalComodin");
            modal.classList.add("visible");
            renderPanelComodin(jugador);
        }

        function renderPanelComodin(jugador) {
            const container = document.getElementById("opcionesComodin");
            let html = `
                <div style="font-size:0.9em; color:var(--sand-dim); text-align:center; margin-bottom:10px;">
                    ⭐ Tienes <strong style="color:var(--ochre-light);">${jugador.casillero.comodines.length}</strong> comodines
                </div>
                <div style="margin-bottom:12px; border-top:1px solid var(--line); padding-top:10px;">
                    <div style="font-size:0.85em; color:var(--sand-dim); text-align:center; margin-bottom:6px;">Canjea 2 comodines por una carta:</div>
                    <div class="panel-comodin-suma">
                        <span class="label">❓ Preguntas</span>
                        <span class="valor" id="comodinPreguntas">${comodinState.preguntas}</span>
                        <span>
                            <button class="btn-suma" onclick="sumarComodin('preguntas')">+</button>
                            <button class="btn-resta" onclick="restarComodin('preguntas')">-</button>
                        </span>
                    </div>
                    <div class="panel-comodin-suma">
                        <span class="label">👗 Vestimentas</span>
                        <span class="valor" id="comodinVestimentas">${comodinState.vestimentas}</span>
                        <span>
                            <button class="btn-suma" onclick="sumarComodin('vestimentas')">+</button>
                            <button class="btn-resta" onclick="restarComodin('vestimentas')">-</button>
                        </span>
                    </div>
                    <div class="panel-comodin-suma">
                        <span class="label">🎶 Coplas</span>
                        <span class="valor" id="comodinCoplas">${comodinState.coplas}</span>
                        <span>
                            <button class="btn-suma" onclick="sumarComodin('coplas')">+</button>
                            <button class="btn-resta" onclick="restarComodin('coplas')">-</button>
                        </span>
                    </div>
                </div>
                <div style="text-align:center; font-size:0.85em; color:var(--sand-dim); margin-bottom:8px;">
                    Comodines disponibles: <span id="comodinDisponibles" style="color:var(--ochre-light); font-weight:700;">${comodinState.comodines}</span>
                </div>
                <button class="btn-principal" onclick="confirmarCanjeComodin()" id="btnConfirmarCanje" style="font-size:0.95em; padding:12px;">
                    ✅ Confirmar canje
                </button>
            `;
            container.innerHTML = html;
        }

        function sumarComodin(tipo) {
            const jugador = getJugadorActivo();
            if (!jugador) return;
            const comodinesDisponibles = jugador.casillero.comodines.length;
            const gastados = (comodinState.preguntas + comodinState.vestimentas + comodinState.coplas) * 2;
            if (gastados >= comodinesDisponibles) {
                mostrarToast("⚠️ No tienes suficientes comodines.");
                return;
            }
            if (tipo === 'preguntas' && comodinState.preguntas >= 3) { mostrarToast("⚠️ Máximo 3 preguntas."); return; }
            if (tipo === 'vestimentas' && comodinState.vestimentas >= 3) { mostrarToast("⚠️ Máximo 3 vestimentas."); return; }
            if (tipo === 'coplas' && comodinState.coplas >= 3) { mostrarToast("⚠️ Máximo 3 coplas."); return; }
            comodinState[tipo]++;
            actualizarPanelComodin();
        }

        function restarComodin(tipo) {
            if (comodinState[tipo] <= 0) {
                mostrarToast("⚠️ No hay nada que restar.");
                return;
            }
            comodinState[tipo]--;
            actualizarPanelComodin();
        }

        function actualizarPanelComodin() {
            document.getElementById('comodinPreguntas').textContent = comodinState.preguntas;
            document.getElementById('comodinVestimentas').textContent = comodinState.vestimentas;
            document.getElementById('comodinCoplas').textContent = comodinState.coplas;
            const comodinesUsados = (comodinState.preguntas + comodinState.vestimentas + comodinState.coplas) * 2;
            const disponibles = getJugadorActivo().casillero.comodines.length - comodinesUsados;
            document.getElementById('comodinDisponibles').textContent = disponibles;
        }

        function confirmarCanjeComodin() {
            const jugador = getJugadorActivo();
            if (!jugador) return;
            const total = comodinState.preguntas + comodinState.vestimentas + comodinState.coplas;
            if (total === 0) {
                mostrarToast("⚠️ No has seleccionado nada para canjear.");
                return;
            }
            const comodinesNecesarios = total * 2;
            if (comodinesNecesarios > jugador.casillero.comodines.length) {
                mostrarToast("⚠️ No tienes suficientes comodines.");
                return;
            }
            if (!confirm(`¿Canjear ${comodinesNecesarios} comodines por ${total} carta(s)?`)) return;
            for (let i = 0; i < comodinesNecesarios; i++) {
                jugador.casillero.comodines.pop();
            }
            const cartasAñadidas = [];
            for (let i = 0; i < comodinState.preguntas; i++) {
                if (mazos.preguntas.length > 0 && jugador.casillero.preguntas.length < 3) {
                    const carta = mazos.preguntas.pop();
                    jugador.casillero.preguntas.push(carta);
                    cartasAñadidas.push(`Pregunta ${carta.id}`);
                }
            }
            for (let i = 0; i < comodinState.vestimentas; i++) {
                if (mazos.vestimentas.length > 0 && jugador.casillero.vestimentas.length < 3) {
                    const carta = mazos.vestimentas.pop();
                    jugador.casillero.vestimentas.push(carta);
                    cartasAñadidas.push(`Vestimenta ${carta.id}`);
                }
            }
            for (let i = 0; i < comodinState.coplas; i++) {
                if (mazos.coplas.length > 0 && jugador.casillero.coplas.length < 3) {
                    const carta = mazos.coplas.pop();
                    jugador.casillero.coplas.push(carta);
                    cartasAñadidas.push(`Copla ${carta.id}`);
                }
            }
            if (cartasAñadidas.length > 0) {
                mostrarToast(`✅ Canjeado: ${cartasAñadidas.join(', ')}`);
            } else {
                mostrarToast("⚠️ No se pudieron añadir cartas (mazos vacíos o sección llena).");
            }
            cerrarModalComodin();
            renderizarCasilleros();
            guardarPartidaAuto();
        }

        function cerrarModalComodin() {
            document.getElementById("modalComodin").classList.remove("visible");
        }

        // ============================================================
        // 🏆 BAILE DE TAIFAS
        // ============================================================
        function abrirModalTaifas() {
            const jugador = getJugadorActivo();
            if (!jugador) return;
            if (!comprobarRequisitosTaifas(jugador)) {
                mostrarToast("⚠️ No cumples los requisitos.");
                return;
            }
            participantesTaifas = jugadores.filter(j => j.nombre !== jugador.nombre).map(j => j.nombre);

            const modal = document.getElementById("modalTaifas");
            modal.classList.add("visible");
            const container = document.getElementById("contenidoTaifas");

            const lugaresPendientes = LUGARES_TAIFAS.filter(l => !jugador.casillero.taifasLogrados.includes(l));

            let html = `
                <p style="color:var(--sand-dim); margin-bottom:8px;">📍 Elige el lugar:</p>
                <div style="display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px; justify-content:center;">
                    ${lugaresPendientes.map(l => `<button class="btn-secundario" onclick="seleccionarLugarTaifas('${l}')" style="margin:2px;" id="btnLugar_${l}">${l}</button>`).join('')}
                </div>
                <p style="color:var(--sand-dim); margin-bottom:8px;">🕺 Elige 3 bailes (en el orden que los realizarás):</p>
                <div id="bailesTaifasSeleccion" style="display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px; justify-content:center;">
                    ${jugador.casillero.bailes.map((b, i) => `
                        <button class="btn-secundario" onclick="toggleBaileTaifas(${i})" id="btnBaileTaifas_${i}" style="margin:2px;">
                            ${b.id} ${b.nombre}
                            <a href="${b.enlace}" target="_blank" style="color:var(--ocean-light); margin-left:6px; text-decoration:none; font-size:0.9em;">🔗</a>
                        </button>
                    `).join('')}
                </div>
                <div style="font-size:0.85em; color:var(--sand-dim); text-align:center;">Seleccionados: <span id="contadorBailesTaifas">0</span>/3</div>
                <div style="margin-top:12px; border-top:1px solid var(--line); padding-top:10px;">
                    <p style="color:var(--sand-dim); font-size:0.9em; margin-bottom:6px;">👥 Jugadores que participan (recibirán comodín si ganas):</p>
                    <div class="selector-participantes" id="participantesTaifas">
                        ${jugadores.filter(j => j.nombre !== jugador.nombre).map(j => `
                            <button onclick="toggleParticipanteTaifas('${j.nombre}')" id="part_${j.nombre}" class="${participantesTaifas.includes(j.nombre) ? 'seleccionado' : ''}">${j.nombre}</button>
                        `).join('')}
                    </div>
                </div>
                <button class="btn-principal" onclick="confirmarTaifas()" id="btnConfirmarTaifas" style="margin-top:12px; display:none;">✅ Confirmar Baile de Taifas</button>
            `;
            container.innerHTML = html;
            window.taifasState = { lugar: null, bailesSeleccionados: [], jugador: jugador };
        }

        function toggleParticipanteTaifas(nombre) {
            const idx = participantesTaifas.indexOf(nombre);
            if (idx !== -1) {
                participantesTaifas.splice(idx, 1);
                document.getElementById(`part_${nombre}`).classList.remove('seleccionado');
            } else {
                participantesTaifas.push(nombre);
                document.getElementById(`part_${nombre}`).classList.add('seleccionado');
            }
        }

        function seleccionarLugarTaifas(lugar) {
            window.taifasState.lugar = lugar;
            mostrarToast(`📍 Lugar seleccionado: ${lugar}`);
            document.querySelectorAll('#contenidoTaifas .btn-secundario').forEach(b => {
                if (b.textContent.trim() === lugar) {
                    b.style.borderColor = 'var(--ochre)';
                    b.style.background = 'rgba(212,160,23,0.3)';
                } else {
                    b.style.borderColor = 'var(--line)';
                    b.style.background = 'var(--basalt-1)';
                }
            });
            actualizarBotonConfirmarTaifas();
        }

        function toggleBaileTaifas(index) {
            const state = window.taifasState;
            const idx = state.bailesSeleccionados.indexOf(index);
            if (idx !== -1) {
                state.bailesSeleccionados.splice(idx, 1);
            } else {
                if (state.bailesSeleccionados.length >= 3) {
                    mostrarToast("Ya has seleccionado 3 bailes.");
                    return;
                }
                state.bailesSeleccionados.push(index);
            }
            document.querySelectorAll('#bailesTaifasSeleccion .btn-secundario').forEach((btn, i) => {
                if (state.bailesSeleccionados.includes(i)) {
                    btn.style.borderColor = 'var(--ochre)';
                    btn.style.background = 'rgba(212,160,23,0.2)';
                } else {
                    btn.style.borderColor = 'var(--line)';
                    btn.style.background = 'var(--basalt-1)';
                }
            });
            document.getElementById('contadorBailesTaifas').textContent = state.bailesSeleccionados.length;
            actualizarBotonConfirmarTaifas();
        }

        function actualizarBotonConfirmarTaifas() {
            const state = window.taifasState;
            const btn = document.getElementById('btnConfirmarTaifas');
            if (state.lugar && state.bailesSeleccionados.length === 3) {
                btn.style.display = 'block';
            } else {
                btn.style.display = 'none';
            }
        }

        function confirmarTaifas() {
            const state = window.taifasState;
            if (!state.lugar || state.bailesSeleccionados.length !== 3) {
                mostrarToast("Selecciona lugar y 3 bailes.");
                return;
            }
            const jugador = state.jugador;
            const bailesElegidos = state.bailesSeleccionados.map(i => jugador.casillero.bailes[i]);
            cerrarModalTaifas();
            iniciarVotacionTaifas(jugador, state.lugar, bailesElegidos);
        }

        function cerrarModalTaifas() {
            document.getElementById("modalTaifas").classList.remove("visible");
        }

        // ============================================================
        // 🗳️ VOTACIÓN (incluye al jugador que propone)
        // ============================================================
        function iniciarVotacionTaifas(jugador, lugar, bailesElegidos) {
            let votantes = [jugador];
            jugadores.forEach(j => {
                if (!votantes.some(v => v.nombre === j.nombre)) {
                    votantes.push(j);
                }
            });
            if (votantes.length === 0) {
                finalizarVotacionTaifas(jugador, lugar, bailesElegidos, true);
                return;
            }
            votacionEnCurso = {
                tipo: 'taifas',
                jugador: jugador,
                lugar: lugar,
                bailesElegidos: bailesElegidos,
                votantes: votantes,
                votos: [],
                indiceVotante: 0
            };
            mostrarVotanteTaifas();
        }

        function mostrarVotanteTaifas() {
            const v = votacionEnCurso;
            if (v.indiceVotante >= v.votantes.length) {
                const aprobados = v.votos.filter(voto => voto).length;
                const exito = aprobados > v.votantes.length / 2;
                finalizarVotacionTaifas(v.jugador, v.lugar, v.bailesElegidos, exito);
                return;
            }
            const votante = v.votantes[v.indiceVotante];
            const modal = document.getElementById('modalVotacion');
            modal.classList.add('visible');
            document.getElementById('tituloVotacion').textContent = `🗳️ Votación - ${v.lugar}`;

            const container = document.getElementById('contenidoVotacion');
            container.innerHTML = `
                <div style="text-align:center; padding:10px 0;">
                    <p style="color:var(--sand); font-size:1.1em;">${votante.nombre}, ¿cree que ${v.jugador.nombre} ha bailado bien?</p>
                    <p style="color:var(--sand-dim); font-size:0.9em; margin:8px 0;">Bailes: ${v.bailesElegidos.map(b => b.nombre).join(' · ')}</p>
                    <div class="votacion-botones">
                        <button class="si" onclick="votarTaifas(true)">👍 Sí</button>
                        <button class="no" onclick="votarTaifas(false)">👎 No</button>
                    </div>
                    <p style="color:var(--sand-dim); font-size:0.8em;">Votante ${v.indiceVotante+1}/${v.votantes.length}</p>
                </div>
            `;
        }

        function votarTaifas(aprobado) {
            const v = votacionEnCurso;
            v.votos.push(aprobado);
            v.indiceVotante++;
            document.getElementById('modalVotacion').classList.remove('visible');
            setTimeout(mostrarVotanteTaifas, 400);
        }

        function finalizarVotacionTaifas(jugador, lugar, bailesElegidos, exito) {
            votacionEnCurso = null;
            document.getElementById('modalVotacion').classList.remove('visible');
            if (exito) {
                jugador.casillero.taifasLogrados.push(lugar);
                const idsAEliminar = bailesElegidos.map(b => b.id);
                jugador.casillero.bailes = jugador.casillero.bailes.filter(b => !idsAEliminar.includes(b.id));
                if (jugador.casillero.preguntas.length > 0) jugador.casillero.preguntas.shift();
                if (jugador.casillero.vestimentas.length > 0) jugador.casillero.vestimentas.shift();
                if (jugador.casillero.coplas.length > 0) jugador.casillero.coplas.shift();
                if (jugador.casillero.comodines.length > 0) jugador.casillero.comodines.shift();

                participantesTaifas.forEach(nombre => {
                    const participante = jugadores.find(j => j.nombre === nombre);
                    if (participante && participante.casillero.comodines.length < 5) {
                        participante.casillero.comodines.push({});
                        mostrarToast(`⭐ ${nombre} gana un comodín por participar.`, 2000);
                    }
                });

                mostrarToast(`🎉 ¡${jugador.nombre} ha conseguido ${lugar}!`);
                historial.push({
                    ronda: ronda + 1,
                    jugador: jugador.nombre,
                    tipo: 'taifas',
                    exito: true,
                    lugar: lugar
                });
                setTimeout(() => {
                    renderizarCasilleros();
                    const taifas = document.querySelectorAll('.tarjeta.taifa');
                    taifas.forEach(el => {
                        if (el.textContent.includes(lugar)) {
                            el.classList.add('destacada');
                            setTimeout(() => el.classList.remove('destacada'), 2000);
                        }
                    });
                }, 300);
            } else {
                bailesElegidos.forEach(b => mazos.bailes.push(b));
                mostrarToast(`❌ ${jugador.nombre} no ha conseguido ${lugar}.`);
                historial.push({
                    ronda: ronda + 1,
                    jugador: jugador.nombre,
                    tipo: 'taifas',
                    exito: false,
                    lugar: lugar
                });
            }
            renderizarCasilleros();
            guardarPartidaAuto();
            if (jugador.casillero.taifasLogrados.length === LUGARES_TAIFAS.length) {
                mostrarToast(`🏆 ¡${jugador.nombre} ha ganado la partida!`);
                finalizarPartida();
                return;
            }
            setTimeout(() => {
                if (partidaActiva) {
                    siguienteTurno();
                }
            }, 3000);
        }

        // ============================================================
        // 🖼️ RENDERIZAR CASILLEROS
        // ============================================================
        function renderizarCasilleros() {
            const container = document.getElementById('casillerosContainer');
            if (jugadores.length === 0) {
                container.innerHTML = '<span style="color:var(--sand-dim);font-size:0.9em;">Añade jugadores.</span>';
                return;
            }
            const ordenVisual = [];
            if (partidaActiva && turnoActual !== undefined) ordenVisual.push(turnoActual);
            if (partidaActiva && asistenteActual !== undefined && asistenteActual !== turnoActual) ordenVisual.push(asistenteActual);
            jugadores.forEach((_, i) => { if (!ordenVisual.includes(i)) ordenVisual.push(i); });

            let html = '';
            ordenVisual.forEach(idx => {
                const j = jugadores[idx];
                const esTurno = partidaActiva && idx === turnoActual;
                const esAsistente = partidaActiva && idx === asistenteActual;
                const c = j.casillero;
                let clases = 'casillero-jugador';
                if (esTurno) clases += ' turno';
                if (esAsistente) clases += ' asistente';
                let etiqueta = '';
                if (esTurno) etiqueta = '🎯 Turno';
                else if (esAsistente) etiqueta = '🎭 Asistente';

                const puedeTaifas = esTurno && comprobarRequisitosTaifas(j);

                const barraProgreso = (actual, maximo) => {
                    const porcentaje = Math.min((actual / maximo) * 100, 100);
                    const clase = porcentaje >= 100 ? 'completo' : '';
                    return `<div class="barra-progreso"><div class="relleno ${clase}" style="width:${porcentaje}%;"></div></div>`;
                };

                html += `
                    <div class="${clases}" style="border-left-color:${j.color}; border-left-width:4px;">
                        <div class="nombre" style="color:${j.color};">
                            ${j.nombre}
                            ${etiqueta ? `<span class="etiqueta ${esAsistente ? 'asistente' : ''}">${etiqueta}</span>` : ''}
                        </div>
                        <div class="color-border" style="background:${j.color};"></div>
                        
                        <div class="seccion">
                            <div class="seccion-titulo">🕺 Bailes <span class="contador">${c.bailes.length}/5</span></div>
                            ${barraProgreso(c.bailes.length, 5)}
                            <div class="tarjetas">${c.bailes.length > 0 ? c.bailes.map(b => `<span class="tarjeta">${b.id} ${b.nombre}</span>`).join('') : '<span class="vacio">Vacío</span>'}</div>
                        </div>
                        
                        <div class="seccion">
                            <div class="seccion-titulo">❓ Preguntas <span class="contador">${c.preguntas.length}/3</span></div>
                            ${barraProgreso(c.preguntas.length, 3)}
                            <div class="tarjetas">${c.preguntas.length > 0 ? c.preguntas.map(p => `<span class="tarjeta">${p.id}</span>`).join('') : '<span class="vacio">Vacío</span>'}</div>
                        </div>
                        
                        <div class="seccion">
                            <div class="seccion-titulo">👗 Vestimentas <span class="contador">${c.vestimentas.length}/3</span></div>
                            ${barraProgreso(c.vestimentas.length, 3)}
                            <div class="tarjetas">${c.vestimentas.length > 0 ? c.vestimentas.map(v => `<span class="tarjeta">${v.id}</span>`).join('') : '<span class="vacio">Vacío</span>'}</div>
                        </div>
                        
                        <div class="seccion">
                            <div class="seccion-titulo">🎶 Coplas <span class="contador">${c.coplas.length}/3</span></div>
                            ${barraProgreso(c.coplas.length, 3)}
                            <div class="tarjetas">${c.coplas.length > 0 ? c.coplas.map(co => `<span class="tarjeta">${co.id}</span>`).join('') : '<span class="vacio">Vacío</span>'}</div>
                        </div>
                        
                        <div class="seccion">
                            <div class="seccion-titulo">⭐ Comodines <span class="contador">${c.comodines.length}/5</span></div>
                            ${barraProgreso(c.comodines.length, 5)}
                            <div class="tarjetas">${c.comodines.length > 0 ? c.comodines.map((_, i) => `<span class="tarjeta comodin">#${i+1}</span>`).join('') : '<span class="vacio">Vacío</span>'}</div>
                            ${esTurno && c.comodines.length > 0 ? `<button class="btn-accion-jugador" onclick="abrirModalComodin()">⭐ Canjear</button>` : ''}
                        </div>
                        
                        <div class="seccion">
                            <div class="seccion-titulo">🏆 Taifas <span class="contador">${c.taifasLogrados.length}/${LUGARES_TAIFAS.length}</span></div>
                            ${barraProgreso(c.taifasLogrados.length, LUGARES_TAIFAS.length)}
                            <div class="tarjetas">${c.taifasLogrados.length > 0 ? c.taifasLogrados.map(l => `<span class="tarjeta taifa">✅ ${l}</span>`).join('') : '<span class="vacio">Ninguno</span>'}</div>
                        </div>
                        
                        ${puedeTaifas ? `<button class="btn-accion-jugador taifas" onclick="abrirModalTaifas()">🏆 ¡Baile de Taifas!</button>` : ''}
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        // ============================================================
        // 🏁 FINAL DE PARTIDA (CON DESEMPATE POR TOTAL DE CARTAS)
        // ============================================================
        function terminarPartida() {
            if (!partidaActiva) {
                mostrarToast("⚠️ No hay partida activa.");
                return;
            }
            if (!confirm("¿Terminar la partida?")) return;
            finalizarPartida();
        }

        function finalizarPartida() {
            partidaActiva = false;
            detenerTemporizadorPrueba();
            document.getElementById("btnTerminarPartida").style.display = "none";
            document.getElementById("btnIniciarPartida").textContent = "🎵 Nueva partida";

            // ✅ ORDENACIÓN CON DESEMPATE POR TOTAL DE CARTAS
            const ordenados = [...jugadores].sort((a, b) => {
                if (b.casillero.taifasLogrados.length !== a.casillero.taifasLogrados.length) {
                    return b.casillero.taifasLogrados.length - a.casillero.taifasLogrados.length;
                }
                const totalA = a.casillero.bailes.length + a.casillero.preguntas.length + a.casillero.vestimentas.length + a.casillero.coplas.length + a.casillero.comodines.length;
                const totalB = b.casillero.bailes.length + b.casillero.preguntas.length + b.casillero.vestimentas.length + b.casillero.coplas.length + b.casillero.comodines.length;
                return totalB - totalA;
            });

            const container = document.getElementById('casillerosContainer');
            let html = `<div class="panel" style="background:var(--basalt-2); border-color:var(--ochre);">
                <div style="text-align:center; color:var(--ochre-light); font-weight:700; font-size:1.1em; margin-bottom:8px;">🏆 Clasificación Final</div>
                <div style="font-size:0.9em; color:var(--sand-dim); text-align:center; margin-bottom:8px;">${historial.length} pruebas realizadas</div>`;
            ordenados.forEach((j, i) => {
                const medalla = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `#${i+1}`;
                const totalCards = j.casillero.bailes.length + j.casillero.preguntas.length + j.casillero.vestimentas.length + j.casillero.coplas.length + j.casillero.comodines.length;
                html += `
                    <div style="display:flex; justify-content:space-between; padding:4px 8px; border-bottom:1px solid var(--line);">
                        <span style="color:${j.color};">${medalla} ${j.nombre}</span>
                        <span style="color:var(--ochre-light);">${j.casillero.taifasLogrados.length} Taifas (${totalCards} cartas)</span>
                    </div>
                `;
            });
            html += `<button class="btn-principal" style="margin-top:12px;" onclick="reiniciarPartida()">🔄 Nueva partida</button>`;
            html += `</div>`;
            container.innerHTML = html;
            guardarPartidaAuto();
        }

        function reiniciarPartida() {
            if (!confirm("¿Reiniciar partida?")) return;
            jugadores.forEach(j => {
                j.casillero = { bailes: [], preguntas: [], vestimentas: [], coplas: [], comodines: [], taifasLogrados: [] };
            });
            partidaActiva = false;
            turnoActual = 0;
            ronda = 0;
            historial = [];
            pruebaEnCurso = null;
            votacionEnCurso = null;
            coplaSeleccionadas = [];
            detenerTemporizadorPrueba();
            document.getElementById("zonaDado").style.display = "none";
            renderizarCasilleros();
            actualizarListaJugadores();
            document.getElementById("btnIniciarPartida").textContent = "🎵 Iniciar BAILANDO VENGO";
            document.getElementById("btnTerminarPartida").style.display = "none";
            guardarPartidaAuto();
            mostrarToast("🔄 Partida reiniciada.");
        }

        // ============================================================
        // 💾 PERSISTENCIA
        // ============================================================
        function guardarPartidaAuto() {
            try {
                const datos = {
                    jugadores,
                    partidaActiva,
                    turnoActual,
                    asistenteActual,
                    ronda,
                    mazos,
                    historial,
                    version: "Final"
                };
                localStorage.setItem('granJuegoFinal', JSON.stringify(datos));
            } catch (e) { console.log('Error guardando:', e); }
        }

        function cargarPartidaAuto() {
            try {
                const datos = localStorage.getItem('granJuegoFinal');
                if (!datos) return;
                const parsed = JSON.parse(datos);
                if (!parsed.jugadores || parsed.jugadores.length === 0) return;
                jugadores = parsed.jugadores;
                partidaActiva = parsed.partidaActiva || false;
                turnoActual = parsed.turnoActual || 0;
                asistenteActual = parsed.asistenteActual || (jugadores.length > 1 ? 1 : 0);
                ronda = parsed.ronda || 0;
                mazos = parsed.mazos || {};
                historial = parsed.historial || [];

                actualizarListaJugadores();
                renderizarCasilleros();

                if (partidaActiva) {
                    document.getElementById("btnIniciarPartida").textContent = "🎵 Partida en curso";
                    document.getElementById("btnTerminarPartida").style.display = "inline-block";
                    const jugador = getJugadorActivo();
                    const asistente = getAsistente();
                    mostrarToast(`🎯 Turno de ${jugador.nombre} (Asistente: ${asistente ? asistente.nombre : 'Sin asistente'})`);
                }
                console.log('✅ Partida final cargada.');
            } catch (e) { console.log('Error cargando:', e); }
        }

        // ============================================================
        // 🚀 INICIO
        // ============================================================
        function iniciarApp() {
            renderizarSelectorColor();
            cargarPartidaAuto();
            if (jugadores.length > 0 && !partidaActiva) renderizarCasilleros();
            console.log('✅ BAILANDO VENGO - Versión Final iniciada.');
        }

        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', iniciarApp);
        else iniciarApp();
    </script>
